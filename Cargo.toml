[workspace]
members = ["tests/cli", "tests/fuzz"]
resolver = "2"

[workspace.package]
version = "0.2.6"
rust-version = "1.85" # also change in ci.yml
authors = ["Laurenz Mädje <laurmaedje@gmail.com>", "Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
edition = "2021"
repository = "https://github.com/typst/subsetter"
readme = "README.md"
license = "MIT OR Apache-2.0"

[package]
name = "subsetter"
description = "Reduces the size and coverage of OpenType fonts."
categories = ["compression", "encoding"]
keywords = ["subsetting", "OpenType", "PDF"]
exclude = ["fonts/*", "tests/*"]
version = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
license = { workspace = true }

[features]
default = ["variable-fonts"]
variable-fonts = ["dep:skrifa", "dep:write-fonts", "dep:kurbo"]

[dependencies]
rustc-hash = "2.1"
skrifa = { optional = true, git = "ssh://git@git.bloudraad.io/external/fontations.git", rev = "c4c9501abff873702bca4b8d04f867cc7742de39" }
kurbo = { optional = true, git = "ssh://git@git.bloudraad.io/external/kurbo.git", rev = "03da2023aac55316eb6287253b34c3f348b775ae" }
write-fonts = { optional = true, git = "ssh://git@git.bloudraad.io/external/fontations.git", rev = "c4c9501abff873702bca4b8d04f867cc7742de39" }

[dev-dependencies]
skrifa = { git = "ssh://git@git.bloudraad.io/external/fontations.git", rev = "c4c9501abff873702bca4b8d04f867cc7742de39" }
ttf-parser = "0.25.1"
